<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community Procurement and Engineering Hub</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#07111d;
    font-family:Arial, sans-serif;
}

canvas{
    display:block;
}

/* Title overlay */
.title{
    position:absolute;
    top:20px;
    width:100%;
    text-align:center;
    color:#cfd8dc;
    font-size:18px;
    letter-spacing:3px;
    z-index:10;
    text-transform:uppercase;
}
</style>
</head>
<body>

<div class="title">Engineering & Procurement Animation</div>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// ----------------------
// Train Text Object
// ----------------------
const train = {
    x: window.innerWidth + 400,
    y: window.innerHeight/2,
    speed: 2.5,
    text: "COMMUNITY PROCUREMENT AND ENGINEERING HUB"
};

// ----------------------
// Sparks
// ----------------------
let sparks = [];

class Spark{
    constructor(x,y){
        this.x=x;
        this.y=y;
        this.vx=(Math.random()*4)-2;
        this.vy=(Math.random()*3)-1.5;
        this.life=40+Math.random()*30;
        this.size=Math.random()*4+1;
    }

    update(){
        this.x += this.vx;
        this.y += this.vy;
        this.life--;
    }

    draw(){
        ctx.beginPath();
        ctx.fillStyle=`rgba(255,215,0,${this.life/70})`;
        ctx.shadowColor="#FFD700";
        ctx.shadowBlur=12;
        ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
        ctx.fill();
        ctx.shadowBlur=0;
    }
}

// ----------------------
// Draw Blueprint Grid
// ----------------------
function drawGrid(){
    ctx.strokeStyle="rgba(0,150,255,0.08)";
    ctx.lineWidth=1;

    for(let x=0;x<canvas.width;x+=50){
        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,canvas.height);
        ctx.stroke();
    }

    for(let y=0;y<canvas.height;y+=50){
        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(canvas.width,y);
        ctx.stroke();
    }
}

// ----------------------
// Draw Rails
// ----------------------
function drawRails(){
    const railY = train.y + 80;

    ctx.strokeStyle="#666";
    ctx.lineWidth=6;

    ctx.beginPath();
    ctx.moveTo(0, railY);
    ctx.lineTo(canvas.width, railY);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, railY+30);
    ctx.lineTo(canvas.width, railY+30);
    ctx.stroke();

    for(let i=0;i<canvas.width;i+=40){
        ctx.strokeStyle="#8d6e63";
        ctx.lineWidth=4;
        ctx.beginPath();
        ctx.moveTo(i, railY);
        ctx.lineTo(i, railY+30);
        ctx.stroke();
    }
}

// ----------------------
// Draw Gear
// ----------------------
function drawGear(cx,cy,radius,rotation){
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(rotation);

    ctx.strokeStyle="#7f8c8d";
    ctx.lineWidth=3;

    for(let i=0;i<12;i++){
        ctx.rotate(Math.PI/6);
        ctx.beginPath();
        ctx.moveTo(radius,0);
        ctx.lineTo(radius+10,0);
        ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(0,0,radius,0,Math.PI*2);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(0,0,radius/3,0,Math.PI*2);
    ctx.stroke();

    ctx.restore();
}

// ----------------------
// Draw Gold Text Train
// ----------------------
function drawTrainText(){

    ctx.font="bold 54px Arial";

    const gradient = ctx.createLinearGradient(
        train.x,0,
        train.x+600,0
    );

    gradient.addColorStop(0,"#8B6508");
    gradient.addColorStop(0.25,"#FFD700");
    gradient.addColorStop(0.5,"#FFF4B0");
    gradient.addColorStop(0.75,"#FFD700");
    gradient.addColorStop(1,"#8B6508");

    ctx.fillStyle=gradient;

    ctx.shadowColor="#FFD700";
    ctx.shadowBlur=25;

    ctx.fillText(train.text,train.x,train.y);

    ctx.shadowBlur=0;

    // Wheels beneath text
    const width = ctx.measureText(train.text).width;

    for(let i=0;i<width;i+=150){
        drawGear(train.x+i+40, train.y+55, 18, performance.now()/600);
    }
}

// ----------------------
// Animation
// ----------------------
function animate(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawGrid();
    drawRails();

    // Moving gears in background
    drawGear(120,120,40,performance.now()/2000);
    drawGear(220,180,28,-performance.now()/1600);
    drawGear(canvas.width-180,150,45,performance.now()/2200);
    drawGear(canvas.width-100,250,30,-performance.now()/1800);

    train.x -= train.speed;

    const textWidth = ctx.measureText(train.text).width;

    if(train.x < -textWidth - 100){
        train.x = canvas.width + 200;
    }

    // Create sparks behind train
    for(let i=0;i<3;i++){
        sparks.push(
            new Spark(
                train.x + textWidth*0.9,
                train.y - 20 + Math.random()*60
            )
        );
    }

    for(let i=sparks.length-1;i>=0;i--){
        sparks[i].update();
        sparks[i].draw();

        if(sparks[i].life <= 0){
            sparks.splice(i,1);
        }
    }

    drawTrainText();

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
