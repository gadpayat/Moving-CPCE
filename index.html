<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COMMUNITY PROCUREMENT AND ENGINEERING HUB</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();

window.addEventListener("resize",resizeCanvas);

const TEXT =
"🏗️ COMMUNITY PROCUREMENT AND ENGINEERING HUB 🚧";

const FONT_SIZE = 90;
const SPEED = 5;

let textX = canvas.width;
let textY = canvas.height/2;

const sparks = [];

/* ==================================
   GOLD TRAIN-LIKE SPARKS
================================== */

class Spark{

    constructor(x,y){

        this.x = x;
        this.y = y;

        // Down-right direction
        this.vx = 3 + Math.random()*6;
        this.vy = 1 + Math.random()*4;

        this.gravity = 0.15;

        this.life = 35 + Math.random()*20;
        this.maxLife = this.life;

        this.size = 1 + Math.random()*2;

        this.length = 10 + Math.random()*25;
    }

    update(){

        this.vy += this.gravity;

        this.x += this.vx;
        this.y += this.vy;

        this.life--;
    }

    draw(){

        const alpha =
        this.life / this.maxLife;

        const tailX =
        this.x - this.vx * this.length/6;

        const tailY =
        this.y - this.vy * this.length/6;

        const gradient =
        ctx.createLinearGradient(
            this.x,
            this.y,
            tailX,
            tailY
        );

        gradient.addColorStop(
            0,
            `rgba(255,255,255,${alpha})`
        );

        gradient.addColorStop(
            0.2,
            `rgba(255,248,180,${alpha})`
        );

        gradient.addColorStop(
            0.5,
            `rgba(255,215,0,${alpha})`
        );

        gradient.addColorStop(
            1,
            `rgba(160,110,0,0)`
        );

        ctx.strokeStyle = gradient;
        ctx.lineWidth = this.size;

        ctx.shadowColor = "#FFD700";
        ctx.shadowBlur = 15;

        ctx.beginPath();
        ctx.moveTo(this.x,this.y);
        ctx.lineTo(tailX,tailY);
        ctx.stroke();

        // Bright gold spark core

        ctx.beginPath();
        ctx.fillStyle =
        `rgba(255,255,220,${alpha})`;

        ctx.arc(
            this.x,
            this.y,
            this.size*0.7,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.shadowBlur = 0;
    }
}

/* ==================================
   SPARK CREATION
================================== */

function createSparks(textWidth){

    for(let i=0;i<35;i++){

        const randomX =
        textX + Math.random()*textWidth;

        // Bottom edge of text only

        const randomY =
        textY + FONT_SIZE*0.35 +
        Math.random()*4;

        sparks.push(
            new Spark(
                randomX,
                randomY
            )
        );
    }
}

/* ==================================
   DRAW GOLD TEXT
================================== */

function drawText(){

    ctx.font =
    `bold ${FONT_SIZE}px Arial`;

    ctx.textBaseline = "middle";

    const textWidth =
    ctx.measureText(TEXT).width;

    const goldGradient =
    ctx.createLinearGradient(
        textX,
        0,
        textX + textWidth,
        0
    );

    goldGradient.addColorStop(0,"#6a4a00");
    goldGradient.addColorStop(0.15,"#b8860b");
    goldGradient.addColorStop(0.35,"#ffd700");
    goldGradient.addColorStop(0.5,"#fff8c6");
    goldGradient.addColorStop(0.65,"#ffd700");
    goldGradient.addColorStop(0.85,"#b8860b");
    goldGradient.addColorStop(1,"#6a4a00");

    ctx.fillStyle = goldGradient;

    ctx.shadowColor = "#FFD700";
    ctx.shadowBlur = 35;

    ctx.fillText(
        TEXT,
        textX,
        textY
    );

    ctx.shadowBlur = 0;

    return textWidth;
}

/* ==================================
   ANIMATION LOOP
================================== */

function animate(){

    // Motion blur background

    ctx.fillStyle =
    "rgba(0,0,0,0.20)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const textWidth =
    drawText();

    createSparks(textWidth);

    for(
        let i=sparks.length-1;
        i>=0;
        i--
    ){

        sparks[i].update();
        sparks[i].draw();

        if(
            sparks[i].life <= 0
        ){
            sparks.splice(i,1);
        }
    }

    textX -= SPEED;

    if(
        textX <
        -textWidth - 200
    ){
        textX =
        canvas.width + 200;
    }

    requestAnimationFrame(
        animate
    );
}

ctx.fillStyle = "#000";
ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
);

animate();

</script>

</body>
</html>
