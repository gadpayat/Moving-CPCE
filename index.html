<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community Procurement & Engineering Hub</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#050505;
    height:100vh;
    width:100vw;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* Banner Area */
.banner{
    position:absolute;
    width:100%;
    overflow:hidden;
    white-space:nowrap;
}

/* Moving Gold Text */
.moving-text{
    display:inline-block;
    white-space:nowrap;

    font-family:Impact, "Arial Black", sans-serif;
    font-size:120px;
    font-weight:900;
    letter-spacing:10px;
    text-transform:uppercase;

    background:linear-gradient(
        to bottom,
        #fff9c4 0%,
        #ffe082 15%,
        #ffd700 35%,
        #ffb300 50%,
        #ffd700 65%,
        #ffe082 85%,
        #fff9c4 100%
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;

    text-shadow:
        0 0 5px #ffd700,
        0 0 10px #ffd700,
        0 0 20px #ffb300,
        0 0 40px #ff8c00,
        0 0 80px #ff8c00;

    animation:moveText 18s linear infinite;
}

@keyframes moveText{
    from{
        transform:translateX(100%);
    }
    to{
        transform:translateX(-100%);
    }
}

/* Spark Effects */
.spark{
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    background:#ffd700;

    box-shadow:
        0 0 10px #ffd700,
        0 0 20px #ffd700,
        0 0 30px #ffb300,
        0 0 50px #ff8c00;

    pointer-events:none;
}

/* Mobile */
@media(max-width:768px){

    .moving-text{
        font-size:60px;
        letter-spacing:4px;
    }

}
</style>

</head>
<body>

<div class="banner">
    <div class="moving-text">
        COMMUNITY PROCUREMENT & ENGINEERING HUB
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        COMMUNITY PROCUREMENT & ENGINEERING HUB
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        COMMUNITY PROCUREMENT & ENGINEERING HUB
    </div>
</div>

<script>

// Create Golden Sparks
function createSpark(){

    const spark = document.createElement("div");
    spark.className = "spark";

    let x = Math.random() * window.innerWidth;

    let y =
        (window.innerHeight / 2)
        + (Math.random() * 180 - 90);

    spark.style.left = x + "px";
    spark.style.top = y + "px";

    document.body.appendChild(spark);

    const dx = (Math.random() - 0.5) * 12;
    const dy = (Math.random() - 0.5) * 12;

    let opacity = 1;
    let scale = 1;

    const animate = setInterval(() => {

        x += dx;
        y += dy;

        opacity -= 0.025;
        scale += 0.02;

        spark.style.left = x + "px";
        spark.style.top = y + "px";
        spark.style.opacity = opacity;
        spark.style.transform =
            `scale(${scale})`;

        if(opacity <= 0){
            clearInterval(animate);
            spark.remove();
        }

    },20);

}

// Continuous Sparks
setInterval(createSpark, 25);

</script>

</body>
</html>
