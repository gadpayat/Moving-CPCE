<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chain Link Text Animation</title>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
}

canvas{
    display:block;
}

</style>

</head>
<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let w,h;

function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    buildText();
}

window.addEventListener("resize",resize);

const TEXT =
"COMMUNITY PROCUREMENT & ENGINEERING HUB";

let links = [];
let sparks = [];

let offsetX = 0;

/* Create Text Shape */

function buildText(){

    links = [];

    const off = document.createElement("canvas");
    const octx = off.getContext("2d");

    off.width = w;
    off.height = h;

    const fontSize =
        Math.min(140, w / 10);

    octx.fillStyle="white";
    octx.textAlign="center";
    octx.textBaseline="middle";
    octx.font =
        "900 " + fontSize +
        "px Arial Black";

    octx.fillText(
        TEXT,
        w/2,
        h/2
    );

    const img =
        octx.getImageData(
            0,0,w,h
        ).data;

    const spacing = 10;

    for(
        let y=0;
        y<h;
        y+=spacing
    ){

        for(
            let x=0;
            x<w;
            x+=spacing
        ){

            const i =
                (y*w+x)*4;

            if(img[i+3] > 120){

                links.push({

                    x:x,
                    y:y,

                    shimmer:
                    Math.random()
                    *Math.PI*2

                });

            }

        }

    }

}

function drawLink(x,y,t){

    const glow =
        0.7 +
        0.3 *
        Math.sin(
            t
        );

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(
        Math.sin(t)*0.2
    );

    const grad =
        ctx.createLinearGradient(
            -8,-8,
            8,8
        );

    grad.addColorStop(
        0,
        "#fff7b0"
    );

    grad.addColorStop(
        0.4,
        "#ffd700"
    );

    grad.addColorStop(
        0.7,
        "#b8860b"
    );

    grad.addColorStop(
        1,
        "#6b4f00"
    );

    ctx.strokeStyle = grad;
    ctx.lineWidth = 3;

    ctx.shadowColor =
        "gold";

    ctx.shadowBlur =
        15*glow;

    ctx.beginPath();

    ctx.ellipse(
        0,0,
        6,4,
        0,
        0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.restore();

}

function createSpark(){

    const p =
        links[
        Math.floor(
            Math.random()
            * links.length
        )];

    if(!p) return;

    sparks.push({

        x:p.x + offsetX,
        y:p.y,

        vx:
        (Math.random()-0.5)*4,

        vy:
        (Math.random()-0.5)*4,

        life:1

    });

}

function drawSpark(s){

    ctx.beginPath();

    ctx.fillStyle=
        "rgba(255,215,0,"
        +s.life+")";

    ctx.shadowColor=
        "gold";

    ctx.shadowBlur=15;

    ctx.arc(
        s.x,
        s.y,
        2,
        0,
        Math.PI*2
    );

    ctx.fill();

}

function animate(){

    requestAnimationFrame(
        animate
    );

    ctx.clearRect(
        0,0,w,h
    );

    offsetX -= 1.5;

    const minX =
        -w*1.5;

    if(offsetX < minX){

        offsetX = w;

    }

    const time =
        performance.now()
        *0.005;

    for(const p of links){

        drawLink(

            p.x + offsetX,

            p.y,

            time
            + p.shimmer

        );

    }

    if(
        Math.random()
        < 0.7
    ){

        createSpark();

    }

    sparks =
    sparks.filter(s=>{

        s.x += s.vx;
        s.y += s.vy;

        s.life -= 0.02;

        drawSpark(s);

        return s.life > 0;

    });

}

resize();
animate();

</script>

</body>
</html>
