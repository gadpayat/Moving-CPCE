<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏗️ COMMUNITY PROCUREMENT AND ENGINEERING HUB 🚧</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);

const TEXT =
"🏗️ COMMUNITY PROCUREMENT AND ENGINEERING HUB 🚧";

const FONT_SIZE = 90;
const SPEED = 5;

let textX = canvas.width;
let textY = canvas.height / 2;

const sparks = [];

/* ===========================
   TRAIN-WHEEL SPARKS
=========================== */

class Spark{

    constructor(x,y){

        this.x = x;
        this.y = y;

        // Strong backward spray
        this.vx = -4 - Math.random()*10;

        // Random vertical spread
        this.vy = -3 + Math.random()*6;

        // Gravity
        this.gravity = 0.18;

        this.life = 25 + Math.random()*20;
        this.maxLife = this.life;

        this.size = 1 + Math.random()*2.5;

        this.length = 10 + Math.random()*25;
    }

    update(){

        this.vy += this.gravity;

        this.x += this.vx;
        this.y += this.vy;

        this.life--;
    }

    draw(){

        const alpha =
        this.life / this.maxLife;

        const tailX =
        this.x - this.vx * this.length / 6;

        const tailY =
        this.y - this.vy * this.length / 6;

        const gradient =
        ctx.createLinearGradient(
            this.x,
            this.y,
            tailX,
            tailY
        );

        gradient.addColorStop(
            0,
            `rgba(255,255,255,${alpha})`
        );

        gradient.addColorStop(
            0.3,
            `rgba(255,230,120,${alpha})`
        );

        gradient.addColorStop(
            0.7,
            `rgba(255,140,0,${alpha})`
        );

        gradient.addColorStop(
            1,
            `rgba(255,60,0,0)`
        );

        ctx.strokeStyle = gradient;
        ctx.lineWidth = this.size;

        ctx.shadowColor = "#ff9900";
        ctx.shadowBlur = 12;

        ctx.beginPath();
        ctx.moveTo(this.x,this.y);
        ctx.lineTo(tailX,tailY);
        ctx.stroke();

        ctx.shadowBlur = 0;

        // White-hot spark core

        ctx.beginPath();

        ctx.fillStyle =
        `rgba(255,255,255,${alpha})`;

        ctx.arc(
            this.x,
            this.y,
            this.size*0.6,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}

/* ===========================
   CREATE SPARK SHOWER
=========================== */

function createSparks(textWidth){

    for(let i=0;i<40;i++){

        const randomX =
        textX + Math.random()*textWidth;

        const randomY =
        textY -
        FONT_SIZE/2 +
        Math.random()*FONT_SIZE;

        sparks.push(
            new Spark(
                randomX,
                randomY
            )
        );
    }
}

/* ===========================
   DRAW GOLD TEXT
=========================== */

function drawText(){

    ctx.font =
    `bold ${FONT_SIZE}px Arial`;

    ctx.textBaseline = "middle";

    const textWidth =
    ctx.measureText(TEXT).width;

    const gold =
    ctx.createLinearGradient(
        textX,
        0,
        textX + textWidth,
        0
    );

    gold.addColorStop(0,"#7a5600");
    gold.addColorStop(0.2,"#cfa000");
    gold.addColorStop(0.4,"#ffd700");
    gold.addColorStop(0.5,"#fff5b8");
    gold.addColorStop(0.6,"#ffd700");
    gold.addColorStop(0.8,"#cfa000");
    gold.addColorStop(1,"#7a5600");

    ctx.fillStyle = gold;

    ctx.shadowColor = "#ffd700";
    ctx.shadowBlur = 35;

    ctx.fillText(
        TEXT,
        textX,
        textY
    );

    ctx.shadowBlur = 0;

    return textWidth;
}

/* ===========================
   ANIMATION
=========================== */

function animate(){

    // Motion blur trail
    ctx.fillStyle =
    "rgba(0,0,0,0.20)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const textWidth =
    drawText();

    createSparks(textWidth);

    for(
        let i=sparks.length-1;
        i>=0;
        i--
    ){

        sparks[i].update();
        sparks[i].draw();

        if(
            sparks[i].life <= 0
        ){
            sparks.splice(i,1);
        }
    }

    textX -= SPEED;

    if(
        textX <
        -textWidth - 200
    ){
        textX =
        canvas.width + 200;
    }

    requestAnimationFrame(
        animate
    );
}

ctx.fillStyle = "#000";
ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
);

animate();

</script>

</body>
</html>
