<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏗️COMMUNITY PROCUREMENT AND ENGINEERING HUB🚧</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000000;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);

const TEXT =
"COMMUNITY PROCUREMENT AND ENGINEERING HUB";

const FONT_SIZE = 90;      // Increased size
const SPEED = 3;

let textX = canvas.width;
let textY = canvas.height / 2;

const sparks = [];

/* ===========================
   SPARK PARTICLES
=========================== */

class Spark {

    constructor(x,y){

        this.x = x;
        this.y = y;

        this.vx = (Math.random()-0.5)*4;
        this.vy = (Math.random()-0.5)*4;

        this.life = 20 + Math.random()*30;
        this.maxLife = this.life;

        this.size = 1 + Math.random()*3;
    }

    update(){

        this.x += this.vx;
        this.y += this.vy;

        this.vx *= 0.98;
        this.vy *= 0.98;

        this.life--;
    }

    draw(){

        const alpha = this.life / this.maxLife;

        ctx.beginPath();

        ctx.fillStyle =
        `rgba(255,215,0,${alpha})`;

        ctx.shadowColor = "#FFD700";
        ctx.shadowBlur = 15;

        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.shadowBlur = 0;
    }
}

/* ===========================
   CREATE SPARKS ALONG TEXT
=========================== */

function createSparks(textWidth){

    for(let i=0;i<18;i++){

        const randomX =
            textX + Math.random()*textWidth;

        const randomY =
            textY - FONT_SIZE/2 +
            Math.random()*FONT_SIZE;

        sparks.push(
            new Spark(randomX,randomY)
        );
    }
}

/* ===========================
   DRAW TEXT
=========================== */

function drawText(){

    ctx.font =
    `bold ${FONT_SIZE}px Arial`;

    ctx.textBaseline = "middle";

    const textWidth =
    ctx.measureText(TEXT).width;

    const goldGradient =
    ctx.createLinearGradient(
        textX,
        0,
        textX + textWidth,
        0
    );

    goldGradient.addColorStop(
        0,
        "#7A5600"
    );

    goldGradient.addColorStop(
        0.2,
        "#CFA000"
    );

    goldGradient.addColorStop(
        0.4,
        "#FFD700"
    );

    goldGradient.addColorStop(
        0.5,
        "#FFF5B8"
    );

    goldGradient.addColorStop(
        0.6,
        "#FFD700"
    );

    goldGradient.addColorStop(
        0.8,
        "#CFA000"
    );

    goldGradient.addColorStop(
        1,
        "#7A5600"
    );

    ctx.fillStyle = goldGradient;

    ctx.shadowColor = "#FFD700";
    ctx.shadowBlur = 35;

    ctx.fillText(
        TEXT,
        textX,
        textY
    );

    ctx.shadowBlur = 0;

    return textWidth;
}

/* ===========================
   ANIMATION LOOP
=========================== */

function animate(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const textWidth = drawText();

    createSparks(textWidth);

    for(
        let i = sparks.length - 1;
        i >= 0;
        i--
    ){

        sparks[i].update();
        sparks[i].draw();

        if(sparks[i].life <= 0){
            sparks.splice(i,1);
        }
    }

    textX -= SPEED;

    if(textX < -textWidth - 100){

        textX = canvas.width + 100;
    }

    requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
