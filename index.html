<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Chain Text</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#030303;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Moving Banner */
.banner{
    position:absolute;
    width:100%;
    overflow:hidden;
    white-space:nowrap;
}

/* Chain Text */
.chain-text{

    display:inline-block;

    font-family:"Arial Black", Impact, sans-serif;
    font-size:130px;
    font-weight:900;
    letter-spacing:10px;
    text-transform:uppercase;

    /* Chain Pattern */
    background:

    radial-gradient(
        circle at 50% 50%,
        #fff9c4 0%,
        #ffe082 20%,
        #ffd700 35%,
        #b8860b 60%,
        #6b4f00 100%
    );

    background-size:40px 40px;

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;

    /* Heavy Glow */
    text-shadow:
        0 0 5px #ffd700,
        0 0 10px #ffd700,
        0 0 20px #ffb300,
        0 0 40px #ff8c00,
        0 0 80px #ff8c00;

    animation:moveText 20s linear infinite;
}

@keyframes moveText{

    from{
        transform:translateX(100%);
    }

    to{
        transform:translateX(-100%);
    }

}

/* Sparks */

.spark{

    position:absolute;

    width:6px;
    height:6px;

    border-radius:50%;

    background:#ffd700;

    box-shadow:
        0 0 10px #ffd700,
        0 0 20px #ffd700,
        0 0 40px #ffb300,
        0 0 60px #ff8c00;

    pointer-events:none;
}

/* Chain Link Overlay Effect */

.chain-overlay{

    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;

    background-image:

    radial-gradient(
        circle,
        rgba(255,215,0,.25) 0%,
        rgba(255,215,0,.08) 30%,
        transparent 50%
    );

    background-size:50px 50px;

    opacity:.35;

    pointer-events:none;
}

@media(max-width:768px){

.chain-text{
    font-size:55px;
    letter-spacing:4px;
}

}

</style>

</head>

<body>

<div class="chain-overlay"></div>

<div class="banner">

<div class="chain-text">

COMMUNITY PROCUREMENT & ENGINEERING HUB

     

COMMUNITY PROCUREMENT & ENGINEERING HUB

</div>

</div>

<script>

/* Golden Sparks */

function createSpark(){

    const spark = document.createElement("div");
    spark.className = "spark";

    let x = Math.random()*window.innerWidth;

    let y =
        window.innerHeight/2
        +
        (Math.random()*220-110);

    spark.style.left = x + "px";
    spark.style.top = y + "px";

    document.body.appendChild(spark);

    let dx = (Math.random()-0.5)*14;
    let dy = (Math.random()-0.5)*14;

    let opacity = 1;
    let scale = 1;

    const animate = setInterval(()=>{

        x += dx;
        y += dy;

        opacity -= 0.025;
        scale += 0.02;

        spark.style.left = x + "px";
        spark.style.top = y + "px";

        spark.style.opacity = opacity;

        spark.style.transform =
            `scale(${scale})`;

        if(opacity <= 0){

            clearInterval(animate);
            spark.remove();

        }

    },20);

}

setInterval(createSpark,20);

</script>

</body>
</html>
