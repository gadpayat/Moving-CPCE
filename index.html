<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COMMUNITY PROCUREMENT AND ENGINEERING HUB</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();

window.addEventListener("resize", resizeCanvas);

const TEXT =
"🏗️ COMMUNITY PROCUREMENT AND ENGINEERING HUB 🚧";

const FONT_SIZE = 90;
const SPEED = 10;

let textX = canvas.width;
let textY = canvas.height / 2;

const sparks = [];

/* =====================================
   GOLD SPARK PARTICLES
===================================== */

class Spark{

    constructor(x,y){

        this.x = x;
        this.y = y;

        // Down-right direction
        this.vx = 3 + Math.random() * 6;
        this.vy = 1 + Math.random() * 4;

        this.gravity = 0.15;

        this.life = 30 + Math.random() * 20;
        this.maxLife = this.life;

        this.size = 1 + Math.random() * 2;

        this.length = 10 + Math.random() * 25;
    }

    update(){

        this.vy += this.gravity;

        this.x += this.vx;
        this.y += this.vy;

        this.life--;
    }

    draw(){

        const alpha =
        this.life / this.maxLife;

        const tailX =
        this.x - this.vx * this.length / 6;

        const tailY =
        this.y - this.vy * this.length / 6;

        const gradient =
        ctx.createLinearGradient(
            this.x,
            this.y,
            tailX,
            tailY
        );

        gradient.addColorStop(
            0,
            `rgba(255,255,255,${alpha})`
        );

        gradient.addColorStop(
            0.25,
            `rgba(255,245,180,${alpha})`
        );

        gradient.addColorStop(
            0.6,
            `rgba(255,215,0,${alpha})`
        );

        gradient.addColorStop(
            1,
            `rgba(140,100,0,0)`
        );

        ctx.strokeStyle = gradient;
        ctx.lineWidth = this.size;

        ctx.shadowColor = "#FFD700";
        ctx.shadowBlur = 12;

        ctx.beginPath();

        ctx.moveTo(this.x,this.y);

        ctx.lineTo(
            tailX,
            tailY
        );

        ctx.stroke();

        // Spark core

        ctx.beginPath();

        ctx.fillStyle =
        `rgba(255,255,220,${alpha})`;

        ctx.arc(
            this.x,
            this.y,
            this.size * 0.7,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.shadowBlur = 0;
    }
}

/* =====================================
   CREATE SPARKS
===================================== */

function createSparks(textWidth){

    for(let i=0;i<35;i++){

        const randomX =
        textX +
        Math.random() * textWidth;

        // Bottom edge only

        const randomY =
        textY +
        FONT_SIZE * 0.35 +
        Math.random() * 4;

        sparks.push(
            new Spark(
                randomX,
                randomY
            )
        );
    }
}

/* =====================================
   DRAW SHARP GOLD TEXT
===================================== */

function drawText(){

    ctx.font =
    `900 ${FONT_SIZE}px Arial Black, Arial, sans-serif`;

    ctx.textBaseline = "middle";

    const textWidth =
    ctx.measureText(TEXT).width;

    const goldGradient =
    ctx.createLinearGradient(
        textX,
        0,
        textX + textWidth,
        0
    );

    goldGradient.addColorStop(0,"#5A3B00");
    goldGradient.addColorStop(0.15,"#B8860B");
    goldGradient.addColorStop(0.35,"#FFD700");
    goldGradient.addColorStop(0.50,"#FFF8C6");
    goldGradient.addColorStop(0.65,"#FFD700");
    goldGradient.addColorStop(0.85,"#B8860B");
    goldGradient.addColorStop(1,"#5A3B00");

    ctx.fillStyle = goldGradient;

    // Dark metallic outline

    ctx.strokeStyle = "#3A2500";
    ctx.lineWidth = 5;

    ctx.strokeText(
        TEXT,
        textX,
        textY
    );

    // Bright highlight outline

    ctx.strokeStyle = "#FFF8C6";
    ctx.lineWidth = 1.5;

    ctx.strokeText(
        TEXT,
        textX,
        textY
    );

    // Gold fill

    ctx.fillText(
        TEXT,
        textX,
        textY
    );

    return textWidth;
}

/* =====================================
   ANIMATION LOOP
===================================== */

function animate(){

    // Motion blur trail

    ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
);

ctx.fillStyle = "#000";

ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
);

    const textWidth =
    drawText();

    createSparks(textWidth);

    for(
        let i=sparks.length-1;
        i>=0;
        i--
    ){

        sparks[i].update();
        sparks[i].draw();

        if(
            sparks[i].life <= 0
        ){
            sparks.splice(i,1);
        }
    }

    textX -= SPEED;

    if(
        textX <
        -textWidth - 200
    ){

        textX =
        canvas.width + 200;
    }

    requestAnimationFrame(
        animate
    );
}

ctx.fillStyle = "#000";
ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
);

requestAnimationFrame(animate);

</script>

</body>
</html>
