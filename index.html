<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community Procurement & Engineering Hub - Chain Link Text</title>

<style>
html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let w, h;
let links = [];
let sparks = [];
let offsetX = 0;

const TEXT =
"COMMUNITY PROCUREMENT & ENGINEERING HUB";

function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    buildText();
}

window.addEventListener("resize", resize);

/* ===========================
   BUILD TEXT FROM CHAIN LINKS
=========================== */

function buildText(){

    links = [];

    const off = document.createElement("canvas");
    const octx = off.getContext("2d");

    off.width = w;
    off.height = h;

    const fontSize = Math.min(160, w / 9);

    octx.fillStyle = "white";
    octx.textAlign = "center";
    octx.textBaseline = "middle";
    octx.font = `900 ${fontSize}px Arial Black`;

    octx.fillText(
        TEXT,
        w / 2,
        h / 2
    );

    const pixels =
        octx.getImageData(
            0,0,w,h
        ).data;

    const spacing = 8;

    for(let y=0; y<h; y+=spacing){

        for(let x=0; x<w; x+=spacing){

            const index =
                (y*w + x) * 4;

            if(pixels[index + 3] > 100){

                links.push({
                    x,
                    y,
                    shimmer:
                    Math.random() *
                    Math.PI * 2
                });

            }
        }
    }
}

/* ===========================
   DRAW GOLD CHAIN LINK
=========================== */

function drawLink(x,y,time){

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(
        Math.sin(time)*0.2
    );

    const glow =
        0.7 +
        0.3 *
        Math.sin(time);

    const grad =
        ctx.createLinearGradient(
            -8,-6,
             8, 6
        );

    grad.addColorStop(0,"#fff7b0");
    grad.addColorStop(0.2,"#ffe082");
    grad.addColorStop(0.5,"#ffd700");
    grad.addColorStop(0.8,"#b8860b");
    grad.addColorStop(1,"#6b4f00");

    ctx.strokeStyle = grad;
    ctx.lineWidth = 3;

    ctx.shadowColor = "#ffd700";
    ctx.shadowBlur = 15 * glow;

    ctx.beginPath();

    ctx.ellipse(
        0,0,
        5.5,3.5,
        0,
        0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.restore();
}

/* ===========================
   CREATE SPARK FROM LETTERS
=========================== */

function createSpark(){

    const link =
        links[
            Math.floor(
                Math.random() *
                links.length
            )
        ];

    if(!link) return;

    sparks.push({

        x:
            link.x +
            offsetX +
            (Math.random()-0.5)*8,

        y:
            link.y +
            (Math.random()-0.5)*6,

        vx:
            (Math.random()-0.5)*6,

        vy:
            (Math.random()-0.5)*6,

        size:
            Math.random()*3 + 2,

        life:1,

        color:
            Math.random() > 0.5
            ? "#FFD700"
            : "#FFA500"
    });
}

/* ===========================
   DRAW SPARK
=========================== */

function drawSpark(s){

    ctx.save();

    ctx.globalAlpha = s.life;

    ctx.shadowColor = s.color;
    ctx.shadowBlur = 20;

    /* Trail */

    ctx.strokeStyle = s.color;
    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(
        s.x - s.vx*4,
        s.y - s.vy*4
    );

    ctx.lineTo(
        s.x,
        s.y
    );

    ctx.stroke();

    /* Spark Core */

    ctx.fillStyle = s.color;

    ctx.beginPath();

    ctx.arc(
        s.x,
        s.y,
        s.size,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();
}

/* ===========================
   ANIMATION LOOP
=========================== */

function animate(){

    requestAnimationFrame(
        animate
    );

    ctx.clearRect(
        0,0,w,h
    );

    /* Moving Text Like Train */
    offsetX -= 1.2;

    if(offsetX < -w*1.8){
        offsetX = w;
    }

    const time =
        performance.now() *
        0.005;

    /* Draw Chain Text */
    for(const link of links){

        drawLink(

            link.x + offsetX,

            link.y,

            time +
            link.shimmer

        );
    }

    /* Generate Sparks */
    if(Math.random() < 0.95){

        for(let i=0;i<4;i++){

            createSpark();

        }
    }

    /* Update Sparks */
    sparks = sparks.filter(s=>{

        s.x += s.vx;
        s.y += s.vy;

        s.vy += 0.05; /* gravity */

        s.life -= 0.015;

        drawSpark(s);

        return s.life > 0;
    });

}

/* ===========================
   START
=========================== */

resize();
animate();

</script>

</body>
</html>
